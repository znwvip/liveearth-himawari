name: collect-himawari

on:
  schedule:
    # 每 30 分钟一次（UTC）。动画按 30 分钟抽帧，这个频率刚好滚动更新。
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install pillow
          echo "--- ffmpeg ---"
          ffmpeg -version 2>&1 | head -1

      - name: Collect & render
        env:
          # 完整地球方形画布。今天 720，以后升级 1080 改 1080x1080 + ZOOM=8
          OUT_W: "720"
          OUT_H: "720"
          ZOOM: "4"
        run: python collect.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          cname: earth.dechp.com
